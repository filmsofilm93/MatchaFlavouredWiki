name: Publish Matcha Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the wiki
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: npm ci

      # Scheduled runs only rebuild when Modrinth has a new release or GitHub
      # main has new commits (exit code 10 means "changed").
      - name: Check whether publishing is needed
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm run --silent update:check -- --check-exit-code
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 10 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # Builds the latest Modrinth release and GitHub main. Fails loudly if a
      # category (recipes, fish, death system...) collapses or drops sharply.
      - name: Rebuild the data
        if: >-
          steps.gate.outputs.publish == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: npm run update

      - name: Lint, test and audit
        if: steps.gate.outputs.publish == 'true'
        run: |
          npm run lint
          npm test
          npm run audit -- --sample=80

      - name: Save synchronized data
        if: >-
          steps.gate.outputs.publish == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/tex app/data/spoilers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update wiki data from Modrinth and GitHub"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Pages
        if: steps.gate.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
